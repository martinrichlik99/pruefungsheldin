<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prüfungsheldin</title>
<meta name="theme-color" content="#fff8f5">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-title" content="Prüfungsheldin">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fff8f5; --karte: #ffffff; --linie: #eae3db; --text: #221a15; --leise: #6b5558;
    --himbeer: #c8325a; --himbeer-dunkel: #af2148; --rose: #fcecef; --rose-linie: #f3c9d3;
    --mint: #10b981; --mint-text: #006c49; --mint-hell: #e3f8ef;
    --gold-hell: #fef3c7; --gold-text: #9a4a06; --rot: #ba1a1a; --rot-hell: #ffe9e6;
    --schatten: 0 4px 20px -2px rgba(74,64,58,0.06);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Plus Jakarta Sans", -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }
  button { font: inherit; color: inherit; cursor: pointer; border: none; background: none; }
  button:focus-visible { outline: 3px solid var(--himbeer); outline-offset: 2px; }
  .seite { max-width: 1400px; margin: 0 auto; padding: 0 24px 8px; }

  /* Kopf */
  .kopf { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--linie); margin-bottom: 16px; flex-wrap: wrap; }
  .marke { display: flex; align-items: center; gap: 10px; font-size: 21px; font-weight: 800; color: var(--himbeer-dunkel); letter-spacing: -0.02em; }
  .marke img { border-radius: 9px; display: block; }
  .kopf-pillen { display: flex; gap: 10px; flex-wrap: wrap; }
  .pille { display: flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 999px; font-size: 14px; font-weight: 700; border: 1px solid var(--linie); background: var(--karte); }
  .pille-gold { background: var(--gold-hell); color: var(--gold-text); border-color: #f7dfa0; }
  .mini-leiste { width: 52px; height: 6px; border-radius: 6px; background: #efe7e0; overflow: hidden; }
  .mini-leiste b { display: block; height: 100%; background: var(--mint-text); border-radius: 6px; }

  /* Held */
  .held { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px; align-items: center; padding: 20px 26px; border-radius: 26px; border: 1px solid var(--linie);
    background: linear-gradient(120deg, #e6f8ef 0%, #fff4ef 45%, #fde9ed 100%); margin-bottom: 12px; }
  .held-zeile { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
  .countdown { background: var(--himbeer-dunkel); color: #fff; padding: 5px 14px; border-radius: 999px; font-size: 14px; font-weight: 700; }
  .held h1 { font-size: clamp(20px, 2.1vw, 28px); white-space: nowrap; font-weight: 800; letter-spacing: -0.03em; line-height: 1.15; margin-bottom: 14px; }
  .held h1 span { color: var(--himbeer-dunkel); }
  .knopf-reihe { display: flex; gap: 10px; flex-wrap: wrap; }
  .held .knopf-reihe { flex-wrap: nowrap; }
  .held .knopf { padding: 10px 20px; min-height: 48px; font-size: 15px; white-space: nowrap; }
  .knopf { display: inline-flex; align-items: center; gap: 12px; padding: 14px 26px; border-radius: 999px; font-weight: 700; font-size: 16px; min-height: 52px; }
  .knopf-haupt { background: var(--himbeer); color: #fff; box-shadow: 0 8px 22px -8px rgba(200,50,90,0.6); text-align: left; }
  .knopf-haupt small { display: block; font-size: 12px; font-weight: 500; opacity: 0.9; }
  .knopf-haupt:hover { background: var(--himbeer-dunkel); }
  .knopf-rand { background: var(--karte); border: 1px solid var(--linie); }
  .knopf-rand:hover { border-color: var(--himbeer); }
  .ring-karte { display: flex; align-items: center; gap: 16px; background: var(--karte); border: 1px solid var(--linie); border-radius: 22px; padding: 14px 18px; box-shadow: var(--schatten); }
  .ring { width: 72px; height: 72px; position: relative; flex-shrink: 0; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 17px; font-weight: 800; }
  .ring-karte strong { display: block; font-size: 15px; white-space: nowrap; }
  .ring-karte span { display: block; font-size: 13px; color: var(--leise); margin: 2px 0 10px; }
  .plus { display: inline-block; background: var(--mint-hell); color: var(--mint-text); font-size: 13px; font-weight: 700; padding: 4px 12px; border-radius: 999px; }

  /* Zahlen */
  .zahlen { display: flex; gap: 14px; padding-left: 16px; border-left: 1px solid var(--linie); }
  .zahl b { display: block; font-size: 26px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; }
  .zahl span { font-size: 11px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--leise); white-space: nowrap; }

  /* Kapitel */
  .abschnitt-kopf { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding-bottom: 8px; border-bottom: 1px solid var(--linie); margin-bottom: 12px; }
  .abschnitt-kopf h2 { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
  .filter { display: flex; gap: 6px; }
  .filter button { padding: 5px 14px; border-radius: 999px; font-size: 14px; font-weight: 600; color: var(--leise); }
  .filter button[aria-pressed="true"] { background: var(--rose); color: var(--himbeer-dunkel); border: 1px solid var(--rose-linie); }
  .kapitel-raster { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
  .kapitel { display: flex; flex-direction: column; gap: 4px; text-align: left; background: var(--karte); border: 1px solid var(--linie); border-radius: 18px; padding: 10px 14px 12px; box-shadow: var(--schatten); transition: transform 0.15s, box-shadow 0.15s; }
  .kapitel:hover { transform: translateY(-2px); box-shadow: 0 8px 28px -4px rgba(225,73,107,0.12); }
  .kapitel.fokus { border: 2px solid var(--himbeer); background: linear-gradient(135deg, #fff 60%, #fdecef); }
  .kapitel.neu { border-style: dashed; border-color: var(--rose-linie); }
  .kapitel h3 { font-size: 15.5px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.25; min-height: 2.5em; }
  .kapitel.fokus h3 { color: var(--himbeer-dunkel); }
  .kapitel .unter { font-size: 12.5px; color: var(--leise); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kapitel-fuss { display: flex; align-items: center; gap: 8px; margin-top: auto; padding-top: 6px; font-size: 13px; font-weight: 700; }
  .kapitel-fuss .leiste { flex: 1; margin-top: 0; }
  .kapitel-fuss .gut { color: var(--mint-text); }
  .kapitel.fokus .kapitel-fuss { color: var(--himbeer-dunkel); }
  .kapitel .unter b { color: var(--text); }
  .kapitel .unter b.gut { color: var(--mint-text); }
  .kapitel.fokus .unter b { color: var(--himbeer-dunkel); }
  .leiste { height: 7px; border-radius: 7px; background: #f5ede8; overflow: hidden; margin-top: auto; }
  .leiste b { display: block; height: 100%; border-radius: 7px; background: var(--himbeer); }
  .leiste b.gut { background: var(--mint-text); }
  .fuss { margin-top: 8px; text-align: center; font-size: 13px; color: var(--leise); }
  .fuss button { color: var(--himbeer-dunkel); font-weight: 700; text-decoration: underline; font-size: 13px; }

  /* Quiz */
  #quiz, #ende { display: none; }
  .quiz-kopf { display: flex; align-items: center; gap: 16px; margin-bottom: 14px; }
  .zurueck { padding: 10px 16px; border-radius: 999px; border: 1px solid var(--linie); background: var(--karte); font-weight: 600; font-size: 14px; }
  .quiz-titel { font-weight: 700; flex: 1; }
  .quiz-zaehler { font-size: 14px; color: var(--leise); font-weight: 600; }
  .quiz-leiste { height: 8px; border-radius: 8px; background: #f0e6e0; overflow: hidden; margin-bottom: 24px; }
  .quiz-leiste b { display: block; height: 100%; background: linear-gradient(90deg, var(--himbeer), #e8708e); transition: width 0.3s; }
  .frage-karte { max-width: 820px; margin: 0 auto; background: var(--karte); border: 1px solid var(--linie); border-radius: 32px; padding: 36px 40px; box-shadow: var(--schatten); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .chip { font-size: 12px; font-weight: 700; letter-spacing: 0.03em; padding: 4px 12px; border-radius: 999px; background: #f5ede8; color: var(--leise); }
  .chip-wichtig { background: var(--gold-hell); color: var(--gold-text); }
  .frage { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.35; margin-bottom: 24px; }
  .optionen { display: flex; flex-direction: column; gap: 10px; margin-bottom: 22px; }
  .option { display: flex; align-items: center; gap: 14px; text-align: left; padding: 15px 20px; border-radius: 18px; border: 1.5px solid var(--linie); background: var(--karte); font-size: 16px; font-weight: 500; }
  .option::before { content: ""; width: 22px; height: 22px; border-radius: 7px; border: 2px solid #cdbfb8; flex-shrink: 0; }
  .option[aria-pressed="true"] { background: var(--rose); border-color: var(--himbeer); }
  .option[aria-pressed="true"]::before { background: var(--himbeer); border-color: var(--himbeer); box-shadow: inset 0 0 0 3px #fff; }
  .option.stimmt { background: var(--mint-hell); border-color: var(--mint); }
  .option.stimmt::before { background: var(--mint); border-color: var(--mint); box-shadow: inset 0 0 0 3px #fff; }
  .option.falsch { background: var(--rot-hell); border-color: var(--rot); }
  .option:disabled { cursor: default; color: var(--text); }
  .wf { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 8px; }
  .wf .knopf { justify-content: center; font-size: 18px; }
  .rueckmeldung { display: none; margin-top: 8px; border-radius: 22px; padding: 20px 24px; background: #faf5f1; border: 1px solid var(--linie); }
  .rueckmeldung.richtig { background: var(--mint-hell); border-color: #a7e8cd; }
  .rueckmeldung.falsch { background: #fff0ee; border-color: #f5c6c0; }
  .urteil { font-size: 18px; font-weight: 800; margin-bottom: 6px; }
  .rueckmeldung.richtig .urteil { color: var(--mint-text); }
  .rueckmeldung.falsch .urteil { color: var(--rot); }
  .loesung { font-weight: 700; font-size: 17px; margin-bottom: 8px; }
  .erklaerung { color: #4a3b3d; font-size: 15.5px; max-width: 70ch; }
  .quelle { font-size: 13px; color: var(--leise); margin-top: 10px; }
  .unten { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
  .melden { font-size: 14px; font-weight: 600; color: var(--leise); padding: 8px 4px; }
  .melden:hover { color: var(--himbeer-dunkel); }

  /* Ende */
  .ende-karte { max-width: 620px; margin: 40px auto 0; text-align: center; background: var(--karte); border: 1px solid var(--linie); border-radius: 32px; padding: 44px 36px; box-shadow: var(--schatten); }
  .ende-karte .gross { font-size: 64px; font-weight: 800; letter-spacing: -0.03em; }
  .ende-karte .note { display: inline-block; margin: 10px 0 4px; padding: 6px 18px; border-radius: 999px; background: var(--gold-hell); color: var(--gold-text); font-weight: 800; }
  .ende-karte p { color: var(--leise); margin: 10px 0 28px; }
  .ende-karte .knopf-reihe { justify-content: center; }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #1f3b31; color: #eafff5; padding: 12px 22px; border-radius: 999px; font-weight: 600; display: none; z-index: 5; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }

  @media (max-width: 1060px) { .kapitel-raster { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  @media (max-width: 820px) {
    .seite { padding: 0 16px 40px; }
    .held { grid-template-columns: 1fr; padding: 20px; }
    .kapitel-raster { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .frage-karte { padding: 24px 20px; border-radius: 24px; }
    .frage { font-size: 20px; }
  }
</style>
</head>
<body>
<div class="seite">
  <header class="kopf">
    <div class="marke"><img src="icons/icon-192.png" alt="" width="34" height="34">Prüfungsheldin</div>
    <div class="kopf-pillen">
      <span class="pille pille-gold" id="serie">🔥 0 Tage</span>
      <span class="pille"><span id="tagesziel">0/30 heute</span><span class="mini-leiste" aria-hidden="true"><b id="tagesziel-leiste" style="width:0%"></b></span></span>
    </div>
  </header>

  <main id="start">
    <section class="held">
      <div>
        <div class="held-zeile"><span class="countdown" id="countdown">⏱ …</span><span id="pruefung-titel"></span></div>
        <h1 id="held-titel"></h1>
        <div class="knopf-reihe">
          <button type="button" class="knopf knopf-haupt" id="jetzt-lernen"><span aria-hidden="true">▶</span><span>Jetzt lernen<small>Smart-Mix: Fehler zuerst</small></span></button>
          <button type="button" class="knopf knopf-rand" id="simulation">📝 Prüfungssimulation (20 Fragen)</button>
        </div>
      </div>
      <div class="ring-karte">
        <div class="ring"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="42" fill="none" stroke="#f1e8e2" stroke-width="10"/><circle id="ring-bogen" cx="50" cy="50" r="42" fill="none" stroke="#c8325a" stroke-width="10" stroke-linecap="round" stroke-dasharray="264" stroke-dashoffset="264"/></svg><b id="ring-zahl">0%</b></div>
        <div><strong>sicher im Stoff</strong><span id="ring-text">0 von 0 Fragen</span><em class="plus" id="ring-plus" style="font-style:normal">+0 % heute</em></div>
        <div class="zahlen">
          <div class="zahl" title="3× hintereinander gewusst"><b id="z-gemeistert" style="color:var(--mint-text)">0</b><span>Gemeistert</span></div>
          <div class="zahl" title="heute fällig"><b id="z-wiederholen" style="color:var(--himbeer-dunkel)">0</b><span>Wiederholen</span></div>
          <div class="zahl"><b id="z-offen">0</b><span>Offen</span></div>
        </div>
      </div>
    </section>

    <section>
      <div class="abschnitt-kopf">
        <h2>Kapitel</h2>
        <div class="filter" role="group" aria-label="Kapitel filtern">
          <button type="button" data-filter="alle" aria-pressed="true">Alle</button>
          <button type="button" data-filter="wiederholen" aria-pressed="false">Wiederholen</button>
          <button type="button" data-filter="offen" aria-pressed="false">Offen</button>
        </div>
      </div>
      <div class="kapitel-raster" id="kapitel"></div>
    </section>
    <p class="fuss" id="fuss"></p>
  </main>

  <main id="quiz">
    <div class="quiz-kopf">
      <button type="button" class="zurueck" id="quiz-zurueck">← Übersicht</button>
      <span class="quiz-titel" id="quiz-titel"></span>
      <span class="quiz-zaehler" id="quiz-zaehler"></span>
    </div>
    <div class="quiz-leiste"><b id="quiz-leiste" style="width:0%"></b></div>
    <article class="frage-karte">
      <div class="chips" id="chips"></div>
      <h2 class="frage" id="frage"></h2>
      <div id="antwortbereich"></div>
      <div class="rueckmeldung" id="rueckmeldung" aria-live="polite">
        <div class="urteil" id="urteil"></div>
        <div class="loesung" id="loesung"></div>
        <div class="erklaerung" id="erklaerung"></div>
        <div class="quelle" id="quelle"></div>
        <div class="unten">
          <button type="button" class="melden" id="melden">⚑ Frage melden</button>
          <button type="button" class="knopf knopf-haupt" id="weiter">Weiter →</button>
        </div>
      </div>
    </article>
  </main>

  <main id="ende">
    <div class="ende-karte">
      <div class="gross" id="ende-zahl"></div>
      <div id="ende-note"></div>
      <p id="ende-text"></p>
      <div class="knopf-reihe">
        <button type="button" class="knopf knopf-rand" id="ende-zurueck">Zur Übersicht</button>
        <button type="button" class="knopf knopf-haupt" id="ende-weiter">Weiterlernen</button>
      </div>
    </div>
  </main>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(function () {
  "use strict";

  var PRUEFUNG = "aphi1";
  var SPEICHER = "ph_" + PRUEFUNG + "_v1";
  var TAGESZIEL = 30;
  var RUNDE = 15;
  var SIMULATION = 20;
  var GEMEISTERT = 3;
  var ABSTAND_TAGE = [0, 1, 2, 4];
  var TYP_NAME = { wf: "Richtig / Falsch", mc: "Ankreuzen", kurz: "Kurze Antwort" };

  var meta = null;
  var fragen = [];
  var runde = [];
  var index = 0;
  var richtigInRunde = 0;
  var rundenArt = "";
  var rundenQuelle = null;
  var filter = "alle";

  function esc(wert) {
    return String(wert === undefined || wert === null ? "" : wert)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function tag(plus) {
    var d = new Date();
    d.setDate(d.getDate() + (plus || 0));
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  function mische(liste) {
    var a = liste.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  var toastUhr = null;
  function toast(text) {
    var el = document.getElementById("toast");
    el.textContent = text;
    el.style.display = "block";
    clearTimeout(toastUhr);
    toastUhr = setTimeout(function () { el.style.display = "none"; }, 3500);
  }

  // ---------- Fortschritt (nur dieses Gerät) ----------
  function leer() { return { fragen: {}, heute: { tag: "", anzahl: 0 }, serie: { anzahl: 0, tag: "" }, verlauf: { tag: "", start: 0 }, gemeldet: {} }; }

  function lade() {
    try {
      var d = JSON.parse(localStorage.getItem(SPEICHER) || "null");
      if (!d || typeof d !== "object") { return leer(); }
      var l = leer();
      Object.keys(l).forEach(function (k) { if (!d[k] || typeof d[k] !== "object") { d[k] = l[k]; } });
      return d;
    } catch (e) {
      toast("Gespeicherter Fortschritt nicht lesbar – neu gestartet.");
      return leer();
    }
  }

  function speichere() {
    try { localStorage.setItem(SPEICHER, JSON.stringify(stand)); }
    catch (e) { toast("Fortschritt konnte nicht gespeichert werden."); }
  }

  var stand = lade();

  function status(f) { return stand.fragen[f.id] || null; }
  function istGemeistert(f) { var s = status(f); return !!s && s.stufe >= GEMEISTERT; }
  function istOffen(f) { return !status(f); }
  function istFaellig(f) { var s = status(f); return !!s && s.stufe < GEMEISTERT && s.faellig <= tag(); }

  function gruppeVon(f) {
    for (var i = 0; i < meta.gruppen.length; i++) {
      var g = meta.gruppen[i];
      if ((g.genau || []).indexOf(f.kapitel) > -1) { return g; }
      for (var j = 0; j < g.praefix.length; j++) { if (f.kapitel.indexOf(g.praefix[j]) === 0) { return g; } }
    }
    return null;
  }

  function prozent(liste) {
    if (liste.length === 0) { return 0; }
    return Math.round(liste.filter(istGemeistert).length / liste.length * 100);
  }

  // ---------- Startseite ----------
  function tageBisPruefung() {
    var t = meta.datum.split("-");
    var ziel = new Date(Number(t[0]), Number(t[1]) - 1, Number(t[2]));
    var heute = new Date(); heute.setHours(0, 0, 0, 0);
    return Math.round((ziel - heute) / 86400000);
  }

  function heuteAnzahl() { return stand.heute.tag === tag() ? stand.heute.anzahl : 0; }

  function gruppenStand() {
    return meta.gruppen.map(function (g) {
      var liste = fragen.filter(function (f) { return gruppeVon(f) === g; });
      return {
        g: g, liste: liste, prozent: prozent(liste),
        gesehen: liste.filter(function (f) { return !istOffen(f); }).length,
        faellig: liste.filter(istFaellig).length,
        offen: liste.filter(istOffen).length
      };
    });
  }

  function zeichneKopf() {
    var heute = heuteAnzahl();
    document.getElementById("serie").textContent = "🔥 " + (stand.serie.tag === tag() || stand.serie.tag === tag(-1) ? stand.serie.anzahl : 0) + " Tage";
    document.getElementById("tagesziel").textContent = (heute >= TAGESZIEL ? "✅ " : "🎯 ") + heute + "/" + TAGESZIEL + " heute";
    document.getElementById("tagesziel-leiste").style.width = Math.min(heute / TAGESZIEL * 100, 100) + "%";
  }

  function zeichneStart() {
    var sicher = prozent(fragen);
    if (stand.verlauf.tag !== tag()) { stand.verlauf = { tag: tag(), start: sicher }; speichere(); }

    var tage = tageBisPruefung();
    document.getElementById("countdown").textContent = "⏱ " + (tage > 1 ? "Noch " + tage + " Tage" : tage === 1 ? "Morgen ist Prüfung" : tage === 0 ? "Heute ist Prüfung 🍀" : "Prüfung vorbei");
    document.getElementById("pruefung-titel").textContent = meta.titel + " · Prüfung am " + new Date(meta.datum + "T12:00").toLocaleDateString("de-AT", { day: "numeric", month: "long" });

    var heute = heuteAnzahl();
    var rest = Math.max(TAGESZIEL - heute, 0);
    document.getElementById("held-titel").innerHTML = rest > 0
      ? "Heute noch " + rest + " Fragen – <span>du schaffst das!</span>"
      : "Tagesziel geschafft – <span>stark! 💪</span>";

    var gs = gruppenStand();
    var begonnen = gs.filter(function (x) { return x.gesehen > 0; });
    begonnen.sort(function (a, b) { return a.prozent - b.prozent; });
    var fokus = begonnen.length > 0 ? begonnen[0] : null;

    zeichneKopf();

    var gemeistert = fragen.filter(istGemeistert).length;
    document.getElementById("ring-zahl").textContent = sicher + "%";
    document.getElementById("ring-bogen").setAttribute("stroke-dashoffset", String(264 - 264 * sicher / 100));
    document.getElementById("ring-text").textContent = gemeistert + " von " + fragen.length + " Fragen";
    var plus = sicher - stand.verlauf.start;
    document.getElementById("ring-plus").textContent = (plus >= 0 ? "+" : "") + plus + " % heute";

    document.getElementById("z-gemeistert").textContent = gemeistert;
    document.getElementById("z-wiederholen").textContent = fragen.filter(istFaellig).length;
    document.getElementById("z-offen").textContent = fragen.filter(istOffen).length;

    var sichtbar = gs.filter(function (x) { return filter === "alle" || (filter === "wiederholen" ? x.faellig > 0 : x.offen > 0); });
    document.getElementById("kapitel").innerHTML = sichtbar.map(function (x) {
      var istFokus = fokus && fokus.g === x.g && x.prozent < 60;
      var gut = x.prozent >= 60;
      return '<button type="button" class="kapitel' + (istFokus ? " fokus" : x.gesehen === 0 ? " neu" : "") + '" data-gruppe="' + esc(x.g.nr) + '" title="' + esc(x.g.thema) + '">' +
        '<h3>' + esc(x.g.nr + " " + x.g.titel) + '</h3>' +
        '<span class="unter">' + (istFokus ? "Fokus nötig · " : x.gesehen === 0 ? "Neu · " : "") + x.liste.length + ' Fragen' + (x.faellig > 0 ? ' · ' + x.faellig + ' fällig' : '') + '</span>' +
        '<span class="kapitel-fuss"><span class="leiste"><b class="' + (gut ? "gut" : "") + '" style="width:' + Math.max(x.prozent, x.gesehen > 0 ? 3 : 0) + '%"></b></span>' +
        '<span class="' + (gut ? "gut" : "") + '">' + x.prozent + ' %</span></span></button>';
    }).join("") || '<p class="unter">Hier ist gerade nichts – super!</p>';

    var gemeldet = Object.keys(stand.gemeldet).length;
    document.getElementById("fuss").innerHTML = "Fortschritt wird nur auf diesem Gerät gespeichert." +
      (gemeldet > 0 ? ' · <button type="button" id="meldungen-senden">' + gemeldet + (gemeldet === 1 ? " gemeldete Frage" : " gemeldete Fragen") + " per Mail senden</button>" : "");
  }

  // ---------- Runden ----------
  function smartMix(liste) {
    var faellig = mische(liste.filter(istFaellig));
    var neu = liste.filter(istOffen);
    var rang = { hoch: 0, normal: 1, niedrig: 2 };
    neu = mische(neu).sort(function (a, b) { return rang[a.prio] - rang[b.prio]; });
    var spaeter = mische(liste.filter(function (f) { return !istOffen(f) && !istGemeistert(f) && !istFaellig(f); }));
    return faellig.concat(neu, spaeter);
  }

  function starte(art, quelle) {
    var liste;
    if (art === "simulation") {
      liste = mische(fragen.filter(function (f) { return f.prio !== "niedrig"; })).slice(0, SIMULATION);
    } else if (art === "kapitel") {
      liste = smartMix(fragen.filter(function (f) { return gruppeVon(f).nr === quelle; }));
    } else {
      liste = smartMix(fragen).slice(0, RUNDE);
    }
    if (liste.length === 0) { toast("Alles gemeistert 🎉 – nimm die Prüfungssimulation."); return; }
    rundenArt = art;
    rundenQuelle = quelle;
    runde = liste;
    index = 0;
    richtigInRunde = 0;
    var titel = art === "simulation" ? "📝 Prüfungssimulation" : art === "kapitel" ? quelle + " " + meta.gruppen.filter(function (g) { return g.nr === quelle; })[0].titel : "▶ Smart-Mix";
    document.getElementById("quiz-titel").textContent = titel;
    zeige("quiz");
    zeichneFrage();
  }

  function zeige(name) {
    ["start", "quiz", "ende"].forEach(function (n) { document.getElementById(n).style.display = n === name ? "block" : "none"; });
    window.scrollTo(0, 0);
  }

  var beantwortet = false;

  function zeichneFrage() {
    beantwortet = false;
    var f = runde[index];
    document.getElementById("quiz-zaehler").textContent = (index + 1) + " / " + runde.length;
    document.getElementById("quiz-leiste").style.width = (index / runde.length * 100) + "%";
    var g = gruppeVon(f);
    var s = status(f);
    document.getElementById("chips").innerHTML =
      '<span class="chip">' + esc(g.nr + " " + g.titel) + '</span><span class="chip">' + TYP_NAME[f.typ] + '</span>' +
      (f.prio === "hoch" ? '<span class="chip chip-wichtig">★ prüfungsrelevant</span>' : '') +
      (s && s.stufe === 0 ? '<span class="chip" style="background:var(--rot-hell);color:var(--rot)">zuletzt falsch</span>' : '');
    document.getElementById("frage").textContent = f.frage;
    document.getElementById("rueckmeldung").style.display = "none";
    document.getElementById("melden").textContent = stand.gemeldet[f.id] ? "⚑ gemeldet" : "⚑ Frage melden";

    var bereich = document.getElementById("antwortbereich");
    if (f.typ === "wf") {
      bereich.innerHTML = '<div class="wf"><button type="button" class="knopf knopf-rand" data-wf="true">✓ Richtig</button><button type="button" class="knopf knopf-rand" data-wf="false">✗ Falsch</button></div>';
    } else if (f.typ === "mc") {
      var reihenfolge = mische(f.optionen.map(function (o, i) { return i; }));
      bereich.innerHTML = '<div class="optionen">' + reihenfolge.map(function (i) {
        return '<button type="button" class="option" aria-pressed="false" data-option="' + i + '">' + esc(f.optionen[i]) + '</button>';
      }).join("") + '</div><div class="knopf-reihe"><button type="button" class="knopf knopf-haupt" id="pruefen">Antwort prüfen</button>' +
        '<span class="quelle" style="align-self:center">' + (f.richtig.length > 1 ? "Mehrere Antworten richtig." : "Eine Antwort richtig.") + '</span></div>';
    } else {
      bereich.innerHTML = '<p class="quelle" style="margin:-8px 0 16px">Erst selbst überlegen (oder laut sagen), dann aufdecken.</p>' +
        '<div class="knopf-reihe" id="aufdecken-reihe"><button type="button" class="knopf knopf-haupt" id="aufdecken">Antwort zeigen</button></div>';
    }
  }

  function zeigeLoesung(richtig, selbst) {
    var f = runde[index];
    var box = document.getElementById("rueckmeldung");
    box.className = "rueckmeldung" + (selbst ? "" : richtig ? " richtig" : " falsch");
    document.getElementById("urteil").textContent = selbst ? "Lösung" : richtig ? "Richtig! 🎉" : "Nicht ganz – merk dir:";
    document.getElementById("loesung").textContent = f.antwortKurz;
    document.getElementById("erklaerung").textContent = f.erklaerung;
    document.getElementById("quelle").textContent = "Skript Seite " + f.seite + (f.vorlesung ? " · Erklärung aus der Vorlesung " + f.vorlesung : "");
    document.getElementById("weiter").style.display = selbst ? "none" : "";
    box.style.display = "block";
  }

  function werte(richtig) {
    var f = runde[index];
    var s = status(f) || { stufe: 0, richtig: 0, falsch: 0, faellig: "" };
    if (richtig) {
      s.stufe = Math.min(s.stufe + 1, GEMEISTERT);
      s.richtig += 1;
      richtigInRunde += 1;
    } else {
      s.stufe = 0;
      s.falsch += 1;
    }
    s.faellig = tag(ABSTAND_TAGE[s.stufe]);
    stand.fragen[f.id] = s;

    if (stand.heute.tag !== tag()) { stand.heute = { tag: tag(), anzahl: 0 }; }
    stand.heute.anzahl += 1;
    if (stand.serie.tag !== tag()) {
      stand.serie.anzahl = stand.serie.tag === tag(-1) ? stand.serie.anzahl + 1 : 1;
      stand.serie.tag = tag();
    }
    if (stand.heute.anzahl === TAGESZIEL) { toast("🎯 Tagesziel geschafft! 🔥 " + stand.serie.anzahl + " Tage in Folge"); }
    else if (richtig && s.stufe === GEMEISTERT) { toast("⭐ Frage gemeistert!"); }
    speichere();
    zeichneKopf();
  }

  function weiter() {
    index += 1;
    if (index < runde.length) { zeichneFrage(); return; }
    var quote = Math.round(richtigInRunde / runde.length * 100);
    document.getElementById("ende-zahl").textContent = richtigInRunde + " / " + runde.length;
    var noteHtml = "";
    if (rundenArt === "simulation") {
      var note = quote >= 89 ? 1 : quote >= 76 ? 2 : quote >= 63 ? 3 : quote >= 50 ? 4 : 5;
      noteHtml = '<span class="note">Geschätzte Note: ' + note + '</span>';
    }
    document.getElementById("ende-note").innerHTML = noteHtml;
    document.getElementById("ende-text").textContent = quote >= 80 ? "Richtig stark – das sitzt! 🌟" : quote >= 50 ? "Gut dabei! Die Fehler kommen in der nächsten Runde zuerst wieder." : "Dranbleiben – genau dafür übst du jetzt. Die Fehler kommen gleich wieder.";
    document.getElementById("ende-weiter").textContent = rundenArt === "simulation" ? "Neue Simulation" : "Nächste Runde";
    zeige("ende");
  }

  // ---------- Ereignisse ----------
  document.getElementById("antwortbereich").addEventListener("click", function (e) {
    if (beantwortet) { return; }
    var f = runde[index];
    var ziel = e.target.closest("button");
    if (!ziel) { return; }
    if (ziel.hasAttribute("data-wf")) {
      beantwortet = true;
      var ok = (ziel.getAttribute("data-wf") === "true") === f.richtig;
      document.querySelectorAll("[data-wf]").forEach(function (k) { k.disabled = true; });
      ziel.style.borderColor = ok ? "var(--mint)" : "var(--rot)";
      ziel.style.background = ok ? "var(--mint-hell)" : "var(--rot-hell)";
      werte(ok);
      zeigeLoesung(ok, false);
    } else if (ziel.hasAttribute("data-option")) {
      ziel.setAttribute("aria-pressed", ziel.getAttribute("aria-pressed") === "true" ? "false" : "true");
    } else if (ziel.id === "pruefen") {
      var knoepfe = document.querySelectorAll("#antwortbereich .option");
      var gewaehlt = [];
      knoepfe.forEach(function (k) { if (k.getAttribute("aria-pressed") === "true") { gewaehlt.push(Number(k.getAttribute("data-option"))); } });
      if (gewaehlt.length === 0) { toast("Wähle mindestens eine Antwort."); return; }
      beantwortet = true;
      var richtigSet = f.richtig.slice().sort().join(",");
      var okMc = gewaehlt.sort().join(",") === richtigSet;
      knoepfe.forEach(function (k) {
        var i = Number(k.getAttribute("data-option"));
        var istRichtig = f.richtig.indexOf(i) > -1;
        if (istRichtig) { k.classList.add("stimmt"); }
        else if (k.getAttribute("aria-pressed") === "true") { k.classList.add("falsch"); }
        k.disabled = true;
      });
      ziel.style.display = "none";
      werte(okMc);
      zeigeLoesung(okMc, false);
    } else if (ziel.id === "aufdecken") {
      document.getElementById("aufdecken-reihe").innerHTML =
        '<button type="button" class="knopf knopf-rand" id="nicht-gewusst" style="color:var(--rot)">✗ Nicht gewusst</button>' +
        '<button type="button" class="knopf knopf-rand" id="gewusst" style="color:var(--mint-text)">✓ Gewusst</button>';
      zeigeLoesung(false, true);
    } else if (ziel.id === "gewusst" || ziel.id === "nicht-gewusst") {
      beantwortet = true;
      var okKurz = ziel.id === "gewusst";
      werte(okKurz);
      weiter();
    }
  });

  document.getElementById("weiter").addEventListener("click", weiter);
  document.getElementById("melden").addEventListener("click", function () {
    var f = runde[index];
    var notiz = window.prompt("Was stimmt an dieser Frage nicht? (optional)", stand.gemeldet[f.id] || "");
    if (notiz === null) { return; }
    stand.gemeldet[f.id] = notiz.trim() || "ohne Notiz";
    speichere();
    document.getElementById("melden").textContent = "⚑ gemeldet";
    toast("Danke – Frage ist gemerkt.");
  });

  document.getElementById("jetzt-lernen").addEventListener("click", function () { starte("smart"); });
  document.getElementById("simulation").addEventListener("click", function () { starte("simulation"); });
  document.getElementById("kapitel").addEventListener("click", function (e) {
    var karte = e.target.closest("[data-gruppe]");
    if (karte) { starte("kapitel", karte.getAttribute("data-gruppe")); }
  });
  document.querySelector(".filter").addEventListener("click", function (e) {
    var b = e.target.closest("[data-filter]");
    if (!b) { return; }
    filter = b.getAttribute("data-filter");
    document.querySelectorAll(".filter button").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
    zeichneStart();
  });
  document.getElementById("fuss").addEventListener("click", function (e) {
    if (!e.target.closest("#meldungen-senden")) { return; }
    var text = Object.keys(stand.gemeldet).map(function (id) {
      var f = fragen.filter(function (x) { return x.id === id; })[0];
      return id + " – " + (f ? f.frage : "?") + "\nNotiz: " + stand.gemeldet[id];
    }).join("\n\n");
    window.location.href = "mailto:?subject=" + encodeURIComponent("Prüfungsheldin – gemeldete Fragen") + "&body=" + encodeURIComponent(text);
  });

  function zurStart() { zeige("start"); zeichneStart(); }
  document.getElementById("quiz-zurueck").addEventListener("click", zurStart);
  document.getElementById("ende-zurueck").addEventListener("click", zurStart);
  document.getElementById("ende-weiter").addEventListener("click", function () { starte(rundenArt, rundenQuelle); });

  // ---------- Laden ----------
  Promise.all([
    fetch("pruefungen/" + PRUEFUNG + "/meta.json").then(function (r) { if (!r.ok) { throw new Error(r.status); } return r.json(); }),
    fetch("pruefungen/" + PRUEFUNG + "/fragen.json").then(function (r) { if (!r.ok) { throw new Error(r.status); } return r.json(); })
  ]).then(function (daten) {
    meta = daten[0];
    fragen = daten[1];
    zeichneStart();
  }).catch(function () {
    document.getElementById("held-titel").textContent = "Fragen konnten nicht geladen werden.";
    document.getElementById("pruefung-titel").textContent = "Bitte Internetverbindung prüfen und die Seite neu laden.";
  });
})();
</script>
</body>
</html>
